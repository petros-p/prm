name: Record demo GIF

# Only re-record when the CLI itself (or the demo script) actually changed —
# not on every commit. Deliberately does NOT include demo.gif, so the commit
# this workflow makes below never retriggers itself or docker-publish.yml.
on:
  push:
    branches: [main]
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - demo.tape
      - .github/workflows/demo-gif.yml

# Needs write access to push the generated GIF back to main.
permissions:
  contents: write

jobs:
  record-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      # vhs-action only installs its ttyd/ffmpeg dependencies when given a
      # tape to run via `path` — passing no path (as an earlier version of
      # this workflow did) installs just the bare `vhs` binary and skips
      # them, so a separate `run: vhs demo.tape` step silently no-ops
      # (exits 0, ~0s elapsed, no file). Let the action run the tape itself.
      - name: Record demo.gif
        uses: charmbracelet/vhs-action@v2
        with:
          path: demo.tape

      - name: Verify demo.gif was created
        run: |
          ls -la
          if [ ! -s demo.gif ]; then
            echo "::error::demo.gif was not created (or is empty) by vhs"
            exit 1
          fi
          echo "demo.gif size: $(stat -c%s demo.gif) bytes"
      - name: Verify demo.gif was created
        run: |
          ls -la
          if [ ! -s demo.gif ]; then
            echo "::error::demo.gif was not created (or is empty) by vhs"
            exit 1
          fi
          echo "demo.gif size: $(stat -c%s demo.gif) bytes"

      - name: Commit demo.gif
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update demo.gif"
          file_pattern: demo.gif
