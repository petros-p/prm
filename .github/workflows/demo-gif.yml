name: Record demo GIF

# Only re-record when the CLI itself (or the demo script) actually changed —
# not on every commit. Deliberately does NOT include demo.gif, so the commit
# this workflow makes below never retriggers itself or docker-publish.yml.
on:
  push:
    branches: [main]
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - demo.tape
      - .github/workflows/demo-gif.yml

# Needs write access to push the generated GIF back to main.
permissions:
  contents: write

jobs:
  record-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Install VHS
        uses: charmbracelet/vhs-action@v2

      - name: Record demo.gif
        run: vhs demo.tape

      - name: Commit demo.gif
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update demo.gif"
          file_pattern: demo.gif
